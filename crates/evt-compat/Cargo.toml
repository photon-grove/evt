[package]
name = "evt-compat"
version = "0.0.0"
description = "Cross-language compatibility harness between photon-evt and the Go evt framework."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Live backends for the cross-language integration driver.
drivers = ["photon-evt/dynamodb", "photon-evt/postgres", "photon-evt/conformance", "dep:aws-config", "dep:aws-sdk-dynamodb", "dep:deadpool-postgres", "dep:tokio-postgres", "aws-sdk-dynamodb/default-https-client", "aws-sdk-dynamodb/rt-tokio"]

[dependencies]
# The conformance feature provides the fault-injecting repository the outcomes scenarios use.
photon-evt = { workspace = true, features = ["conformance"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
aws-config = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }

[[bin]]
name = "evt-compat"
required-features = ["drivers"]

# The conformance suite against live backends; see the file header for setup.
[[test]]
name = "conformance"
required-features = ["drivers"]
