version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      js-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    # The composite actions under .github/actions are not scanned from /.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directories:
      - /infra/local
      - /infra/local-postgres
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      terraform:
        patterns: ["*"]
        update-types: [minor, patch]
