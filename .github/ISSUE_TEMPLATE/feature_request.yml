name: Feature request
description: A capability evt is missing, or an API that could be easier to use.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The [feature matrix](https://github.com/photon-grove/evt/blob/main/docs/reference/feature-matrix.md)
        shows what each language implements today, and what is planned, deferred or cut.
        Check it first, since the feature may already be tracked there.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you building, and where does evt get in the way? Describe the use case rather than a specific API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The behavior or API you have in mind, if you have one.
  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: How you work around it now, if you do.
  - type: checkboxes
    id: languages
    attributes:
      label: Languages
      options:
        - label: Rust
        - label: Go
