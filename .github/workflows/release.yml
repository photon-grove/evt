name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04-arm
    outputs:
      go_release_created: ${{ steps.release.outputs['go--release_created'] }}
      go_tag_name: ${{ steps.release.outputs['go--tag_name'] }}
      crate_release_created: ${{ steps.release.outputs['crates/evt--release_created'] }}
      crate_tag_name: ${{ steps.release.outputs['crates/evt--tag_name'] }}
      lambda_release_created: ${{ steps.release.outputs['crates/evt-lambda--release_created'] }}
      lambda_tag_name: ${{ steps.release.outputs['crates/evt-lambda--tag_name'] }}
      ts_release_created: ${{ steps.release.outputs['packages/evt--release_created'] }}
      ts_tag_name: ${{ steps.release.outputs['packages/evt--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds evt-doctor for the Go module's go/vX.Y.Z release. goreleaser only parses plain semver
  # tags, so it builds from a local vX.Y.Z tag that is never pushed, and the archives are uploaded
  # to the go/vX.Y.Z release that release-please already created.
  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.go_release_created == 'true' }}
    runs-on: ubuntu-24.04-arm
    env:
      GO_TAG: ${{ needs.release-please.outputs.go_tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.go_tag_name }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Tag the build with plain semver
        run: |
          semver_tag="v${GO_TAG#go/v}"
          git tag "$semver_tag"
          echo "GORELEASER_CURRENT_TAG=$semver_tag" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean

      - name: Upload the archives to the go release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GO_TAG" dist/*.tar.gz dist/checksums.txt --clobber

  # Publishes photon-evt when release-please tags a crate release (photon-evt-vX.Y.Z).
  # crates.io only allows trusted publishing (OIDC) for crates that already exist, so the first
  # release uses the CARGO_REGISTRY_TOKEN secret. Once a trusted publisher is configured on
  # crates.io for this workflow, delete the secret and later releases authenticate over OIDC.
  publish-crate:
    needs: release-please
    if: ${{ needs.release-please.outputs.crate_release_created == 'true' }}
    runs-on: ubuntu-24.04-arm
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.crate_tag_name }}

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: publish

      - name: Check for a bootstrap token
        id: bootstrap
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "token=true" >> "$GITHUB_OUTPUT"
          else
            echo "token=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.bootstrap.outputs.token != 'true'

      - name: Publish photon-evt
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: cargo publish -p photon-evt --locked

  # Publishes photon-evt-lambda when release-please tags it (photon-evt-lambda-vX.Y.Z), after
  # photon-evt when both release together: its photon-evt requirement is the version just released.
  # The first release needs the CARGO_REGISTRY_TOKEN secret too, as for photon-evt.
  publish-lambda-crate:
    needs: [release-please, publish-crate]
    if: >-
      ${{ always() && needs.release-please.outputs.lambda_release_created == 'true' &&
      (needs.publish-crate.result == 'success' || needs.publish-crate.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.lambda_tag_name }}

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: publish

      - name: Check for a bootstrap token
        id: bootstrap
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "token=true" >> "$GITHUB_OUTPUT"
          else
            echo "token=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.bootstrap.outputs.token != 'true'

      - name: Publish photon-evt-lambda
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: cargo publish -p photon-evt-lambda --locked

  # Publishes @photon-grove/evt when release-please tags it (evt-ts-vX.Y.Z). npm trusted publishing
  # exchanges this job's OIDC token for a short-lived publish credential, so there's no npm token
  # secret, and --provenance links the version to this run. npm only adds a trusted publisher to a
  # package that exists, so the first release needs the 0.0.0 placeholder from the bootstrap steps
  # in docs/adr/0009-typescript-implementation.md.
  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.ts_release_created == 'true' }}
    runs-on: ubuntu-24.04-arm
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # moon compares against main, which a shallow checkout lacks.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.ts_tag_name }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.5
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Builds dist/, then runs the unit tests and the fixture runner against it.
      - name: Build and test
        run: pnpm exec moon run evt-ts:check evt-ts:test

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Upgrade npm
        run: npm install --global npm@^11.5.1

      - name: Publish @photon-grove/evt
        working-directory: packages/evt
        run: npm publish --access public --provenance
